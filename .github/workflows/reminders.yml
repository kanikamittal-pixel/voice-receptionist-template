# Vercel's free plan only allows daily cron jobs, so GitHub pings the reminder endpoint instead (~every 5 min, best effort).
# Repo secrets needed: APP_URL (https://<your-app>.vercel.app) and CRON_SECRET (same as the app's CRON_SECRET).
name: complaint-reminders
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/reminders
        run: curl -fsS -m 30 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/reminders"
